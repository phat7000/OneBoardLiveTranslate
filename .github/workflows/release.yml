name: Build OneBoard release candidate

# Release candidates are deliberately manual. Publishing remains a separate
# reviewed step while the OneBoard release endpoint and licensing are pending.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Prepare isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt "yasbd-lib>=0.15,<1.0" pytest
          .\.venv\Scripts\python.exe -m pip check

      - name: Test and build portable candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest .\tests
          .\build_oneboard_release.ps1

      - name: Upload workflow artifact (not a Release)
        uses: actions/upload-artifact@v7
        with:
          name: OneBoardLiveTranslate-release-candidate
          path: release/OneBoardLiveTranslate-*-win-x64.zip
          if-no-files-found: error
